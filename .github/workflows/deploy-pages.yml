name: GitHub Pages’e yayımla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: pnpm’i hazırla
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Node.js’i hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Bağımlılıkları yükle
        run: pnpm install --frozen-lockfile
      - name: GitHub Pages üretimini oluştur
        run: pnpm build:pages
      - name: GitHub Pages yapıtını yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages’e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
